name: Build Ultimate Chess APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -q *.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 2 -type f | head -50

      - name: Find project
        run: |
          PROJECT=$(find extracted -name package.json -type f | head -1 | xargs dirname)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV
          echo "Project directory: $PROJECT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.PROJECT }}/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: ${{ env.PROJECT }}
        run: npm install

      - name: Build web app
        working-directory: ${{ env.PROJECT }}
        run: npm run build

      - name: Add Android platform
        working-directory: ${{ env.PROJECT }}
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ env.PROJECT }}/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Chess-APK
          path: ${{ env.PROJECT }}/android/app/build/outputs/apk/debug/app-debug.apk
